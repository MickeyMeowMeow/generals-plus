            "content": "asyncapi: 2.6.0\ninfo:\n  title: Generals Plus 实时接口文档\n  version: 1.0.0\n  description: Generals Plus 游戏房间的 Colyseus 实时消息契约文档\nservers:\n  development:\n    url: ws://localhost:2567\n    protocol: colyseus\n    description: 本地开发服务器\nchannels:\n  match:\n    description: 游戏对战房间。仅通过座位预约信息加入。\n    publish:\n      summary: match 房间客户端上行消息\n      message:\n        oneOf:\n          - $ref: '#/components/messages/match_action'\n          - $ref: '#/components/messages/match_clear_queue'\n          - $ref: '#/components/messages/match_ping'\n    subscribe:\n      summary: match 房间服务端下行消息\n      message:\n        oneOf:\n          - $ref: '#/components/messages/match_game_end'\n          - $ref: '#/components/messages/match_ping'\n    x-colyseus-joinOptions:\n      $schema: https://json-schema.org/draft/2020-12/schema\n      type: object\n      properties: {}\n      additionalProperties: false\n      description: 无需额外参数；客户端通过座位预约信息加入。\n  queue:\n    description: 官方匹配队列房间。按游戏模式进行排队。\n    publish:\n      summary: queue 房间客户端上行消息\n      message:\n        oneOf:\n          - $ref: '#/components/messages/queue_confirm'\n          - $ref: '#/components/messages/queue_pickColor'\n    subscribe:\n      summary: queue 房间服务端下行消息\n      message:\n        oneOf:\n          - $ref: '#/components/messages/queue_error'\n          - $ref: '#/components/messages/queue_seat'\n    x-colyseus-joinOptions:\n      $schema: https://json-schema.org/draft/2020-12/schema\n      type: object\n      properties:\n        gameMode:\n          type: string\n          enum:\n            - classic\n            - demolition\n            - turf_war\n            - biohazard\n            - payload\n            - rugby\n            - collapse\n            - domination\n            - espionage\n          description: 要排队的游戏模式\n      required:\n        - gameMode\n      additionalProperties: false\n      description: 客户端提供的排队选项\n  setup:\n    description: 赛前配置大厅。房主管理设置并启动游戏。\n    publish:\n      summary: setup 房间客户端上行消息\n      message:\n        oneOf:\n          - $ref: '#/components/messages/setup_pickColor'\n          - $ref: '#/components/messages/setup_pickTeam'\n          - $ref: '#/components/messages/setup_updateSettings'\n          - $ref: '#/components/messages/setup_start'\n    subscribe:\n      summary: setup 房间服务端下行消息\n      message:\n        oneOf:\n          - $ref: '#/components/messages/setup_error'\n          - $ref: '#/components/messages/setup_validationFailed'\n          - $ref: '#/components/messages/setup_seat'\n    x-colyseus-joinOptions:\n      $schema: https://json-schema.org/draft/2020-12/schema\n      type: object\n      properties:\n        gameMode:\n          type: string\n          enum:\n            - classic\n            - demolition\n            - turf_war\n            - biohazard\n            - payload\n            - rugby\n            - collapse\n            - domination\n            - espionage\n          description: 用于列出和加入 setup 房间的游戏模式\n      required:\n        - gameMode\n      additionalProperties: false\n    x-colyseus-roomCreationOptions:\n      $schema: https://json-schema.org/draft/2020-12/schema\n      type: object\n      properties:\n        gameMode:\n          default: classic\n          description: 创建 setup 房间时的初始游戏模式\n          type: string\n          enum:\n            - classic\n            - demolition\n            - turf_war\n            - biohazard\n            - payload\n            - rugby\n            - collapse\n            - domination\n            - espionage\n        isPublic:\n          default: true\n          description: 房间是否在公开列表中可见\n          type: boolean\n        maxPlayers:\n          description: 房间可选的最大玩家数覆盖值\n          type: integer\n          minimum: 2\n          maximum: 9007199254740991\n        customRoomKey:\n          description: 服务端为私有 setup 房间预置的自定义房间密钥\n          type: string\n      required:\n        - gameMode\n        - isPublic\n      additionalProperties: false\n  vs-ai:\n    description: 即时 1v1 人机对战房间。加入后会立即创建比赛并下发座位预约信息。\n    publish:\n      summary: vs-ai 房间客户端上行消息\n      message:\n        $ref: '#/components/messages/vs-ai_confirm'\n    subscribe:\n      summary: vs-ai 房间服务端下行消息\n      message:\n        $ref: '#/components/messages/vs-ai_seat'\n    x-colyseus-joinOptions:\n      $schema: https://json-schema.org/draft/2020-12/schema\n      type: object\n      properties: {}\n      additionalProperties: false\n      description: 无需额外参数；通过认证令牌识别玩家身份。\ncomponents:\n  messages:\n    match_action:\n      name: action\n      title: 提交游戏操作\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        oneOf:\n          - type: object\n            properties:\n              type:\n                type: string\n                enum:\n                  - move\n                  - split_move\n                description: 操作类型：move 或 split_move\n              from:\n                type: object\n                properties:\n                  x:\n                    type: integer\n                    minimum: -9007199254740991\n                    maximum: 9007199254740991\n                    description: 网格上的 X 坐标\n                  'y':\n                    type: integer\n                    minimum: -9007199254740991\n                    maximum: 9007199254740991\n                    description: 网格上的 Y 坐标\n                required:\n                  - x\n                  - 'y'\n                additionalProperties: false\n                description: 起始坐标\n              to:\n                type: object\n                properties:\n                  x:\n                    type: integer\n                    minimum: -9007199254740991\n                    maximum: 9007199254740991\n                    description: 网格上的 X 坐标\n                  'y':\n                    type: integer\n                    minimum: -9007199254740991\n                    maximum: 9007199254740991\n                    description: 网格上的 Y 坐标\n                required:\n                  - x\n                  - 'y'\n                additionalProperties: false\n                description: 目标坐标\n            required:\n              - type\n              - from\n              - to\n            additionalProperties: false\n          - type: object\n            properties:\n              type:\n                type: string\n                const: surrender\n                description: 投降并结束本场对局\n            required:\n              - type\n            additionalProperties: false\n    match_clear_queue:\n      name: clear_queue\n      title: 清空操作队列\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties: {}\n        additionalProperties: false\n        description: 无请求体\n    match_ping:\n      name: ping\n      title: 发送地图标记\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          playerId:\n            type: string\n            description: 发送标记的玩家 ID\n          x:\n            type: integer\n            minimum: -9007199254740991\n            maximum: 9007199254740991\n            description: 标记的 X 坐标\n          'y':\n            type: integer\n            minimum: -9007199254740991\n            maximum: 9007199254740991\n            description: 标记的 Y 坐标\n          type:\n            type: string\n            description: 标记类型\n        required:\n          - playerId\n          - x\n          - 'y'\n          - type\n        additionalProperties: false\n    match_game_end:\n      name: game_end\n      title: 比赛结束\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          mode:\n            type: string\n            enum:\n              - classic\n              - demolition\n              - turf_war\n              - biohazard\n              - payload\n              - rugby\n              - collapse\n              - domination\n              - espionage\n            description: 游戏模式\n          winnerTeamId:\n            anyOf:\n              - type: string\n              - type: 'null'\n            description: 获胜队伍 ID；平局时为 null\n        required:\n          - mode\n          - winnerTeamId\n        additionalProperties: false\n    queue_confirm:\n      name: confirm\n      title: 确认座位预约\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties: {}\n        additionalProperties: false\n        description: 无请求体\n    queue_pickColor:\n      name: pickColor\n      title: 选择颜色\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          color:\n            type: integer\n            minimum: -9007199254740991\n            maximum: 9007199254740991\n            description: 调色板颜色索引\n        required:\n          - color\n        additionalProperties: false\n    queue_error:\n      name: error\n      title: 队列错误\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: string\n        description: 面向用户展示的错误消息\n    queue_seat:\n      name: seat\n      title: 下发座位预约\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          name:\n            type: string\n            description: 目标房间名称，例如 match\n          sessionId:\n            type: string\n            description: 客户端会话 ID\n          roomId:\n            type: string\n            description: 目标房间 ID\n          reconnectionToken:\n            description: 用于重连的令牌\n            type: string\n        required:\n          - name\n          - sessionId\n          - roomId\n        additionalProperties: false\n    setup_pickColor:\n      name: pickColor\n      title: 选择颜色\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          color:\n            type: integer\n            minimum: -9007199254740991\n            maximum: 9007199254740991\n            description: 调色板颜色索引\n        required:\n          - color\n        additionalProperties: false\n    setup_pickTeam:\n      name: pickTeam\n      title: 选择队伍\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          teamId:\n            description: 要加入的已有队伍 ID\n            type: string\n          createNew:\n            description: 是否请求创建新队伍\n            type: boolean\n        additionalProperties: false\n    setup_updateSettings:\n      name: updateSettings\n      title: 更新房间设置\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          gameMode:\n            type: string\n            enum:\n              - classic\n              - demolition\n              - turf_war\n              - biohazard\n              - payload\n              - rugby\n              - collapse\n              - domination\n              - espionage\n            description: 游戏模式\n          maxPlayers:\n            type: integer\n            minimum: 2\n            maximum: 9007199254740991\n            description: 最大玩家人数\n          isPublic:\n            type: boolean\n            description: 房间是否公开展示\n          playersPerTeam:\n            type: integer\n            minimum: 1\n            maximum: 9007199254740991\n            description: 每队玩家数\n          mapType:\n            type: string\n            enum:\n              - square\n              - hex\n            description: 地图网格类型：方格或六边形\n          mapSource:\n            type: string\n            enum:\n              - generated\n              - custom\n            description: 地图来源：程序生成或自定义地图\n          customMapId:\n            type: string\n            description: 自定义地图 ID，在 mapSource 为 custom 时使用\n          mapWidth:\n            type: integer\n            minimum: 5\n            maximum: 100\n            description: 方格地图宽度，范围 5 到 100\n          mapHeight:\n            type: integer\n            minimum: 5\n            maximum: 100\n            description: 方格地图高度，范围 5 到 100\n          mapLeft:\n            type: integer\n            minimum: 5\n            maximum: 100\n            description: 六边形地图左半径\n          mapRight:\n            type: integer\n            minimum: 5\n            maximum: 100\n            description: 六边形地图右半径\n          mapLeftSlant:\n            type: integer\n            minimum: 9\n            maximum: 199\n            description: 六边形地图左斜半径\n          mapRightSlant:\n            type: integer\n            minimum: 9\n            maximum: 199\n            description: 六边形地图右斜半径\n          seed:\n            type: integer\n            minimum: -9007199254740991\n            maximum: 9007199254740991\n            description: 地图生成随机种子\n          mountainRate:\n            type: number\n            minimum: 0\n            maximum: 1\n            description: 山地密度，范围 0 到 1\n          cityRate:\n            type: number\n            minimum: 0\n            maximum: 1\n            description: 城市密度，范围 0 到 1\n          minGeneralDistanceFactor:\n            type: number\n            minimum: 0\n            maximum: 1\n            description: 将军最小距离系数，范围 0 到 1\n          generalInitialTroops:\n            type: integer\n            minimum: 1\n            maximum: 9007199254740991\n            description: 将军初始兵力\n          cityInitialTroops:\n            type: integer\n            minimum: 0\n            maximum: 9007199254740991\n            description: 城市初始兵力\n          speed:\n            type: number\n            minimum: 0.5\n            maximum: 10\n            description: 游戏速度倍率，范围 0.5 到 10\n          duration:\n            type: number\n            minimum: 30\n            maximum: 600\n            description: 对局持续时间，单位秒\n          flagCount:\n            type: integer\n            minimum: 1\n            maximum: 20\n            description: 旗帜数量，仅统治模式生效\n          targetScore:\n            type: integer\n            minimum: 100\n            maximum: 10000\n            description: 获胜分数，仅统治模式生效\n          bombSiteCount:\n            type: integer\n            minimum: 1\n            maximum: 10\n            description: 炸弹点数量，仅爆破模式生效\n          plantDuration:\n            type: number\n            minimum: 1\n            maximum: 30\n            description: 安包时长，单位秒，仅爆破模式生效\n          defuseDuration:\n            type: number\n            minimum: 1\n            maximum: 30\n            description: 拆包时长，单位秒，仅爆破模式生效\n          detonateDuration:\n            type: number\n            minimum: 10\n            maximum: 300\n            description: 爆炸倒计时，单位秒，仅爆破模式生效\n          collapseInterval:\n            type: number\n            minimum: 5\n            maximum: 300\n            description: 塌缩波之间的间隔秒数，仅塌缩模式生效\n          startDelay:\n            type: number\n            minimum: 5\n            maximum: 600\n            description: 首次塌缩前的延迟秒数，仅塌缩模式生效\n          collapseShape:\n            type: string\n            enum:\n              - circle\n              - square\n            description: 塌缩区域形状，仅塌缩模式生效\n          payloadSpeed:\n            type: number\n            minimum: 0.5\n            maximum: 10\n            description: 运载车移动速度，仅运载模式生效\n          payloadCartSize:\n            type: integer\n            minimum: 1\n            maximum: 5\n            description: 运载车大小，仅运载模式生效\n          payloadRequiredOccupied:\n            type: integer\n            minimum: 1\n            maximum: 25\n            description: 推动运载车所需占领人数，仅运载模式生效\n          rugbyBallCount:\n            type: integer\n            minimum: 1\n            maximum: 5\n            description: 橄榄球数量，仅橄榄球模式生效\n          rugbyMoveSpeed:\n            type: number\n            minimum: 0.2\n            maximum: 10\n            description: 橄榄球移动速度，仅橄榄球模式生效\n          rugbyWinningScore:\n            type: integer\n            minimum: 1\n            maximum: 20\n            description: 获胜分数，仅橄榄球模式生效\n          incubationDuration:\n            type: number\n            minimum: 15\n            maximum: 300\n            description: 潜伏时长，单位秒，仅生化模式生效\n          zombieTroopMultiplier:\n            type: number\n            minimum: 1.5\n            maximum: 5\n            description: 僵尸兵力倍率，仅生化模式生效\n        additionalProperties: false\n    setup_start:\n      name: start\n      title: 开始游戏\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties: {}\n        additionalProperties: false\n        description: 无请求体\n    setup_error:\n      name: error\n      title: 房间错误\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: string\n        description: 面向用户展示的错误消息\n    setup_validationFailed:\n      name: validationFailed\n      title: 设置校验失败\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          message:\n            type: string\n            description: 面向用户展示的校验错误消息\n          severity:\n            type: string\n            enum:\n              - info\n              - warning\n              - error\n              - success\n            description: 提示消息严重级别\n          field:\n            description: 校验失败的字段\n            type: string\n        required:\n          - message\n          - severity\n        additionalProperties: false\n    setup_seat:\n      name: seat\n      title: 下发比赛座位预约\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          name:\n            type: string\n            description: 目标房间名称，例如 match\n          sessionId:\n            type: string\n            description: 客户端会话 ID\n          roomId:\n            type: string\n            description: 目标房间 ID\n          reconnectionToken:\n            description: 用于重连的令牌\n            type: string\n        required:\n          - name\n          - sessionId\n          - roomId\n        additionalProperties: false\n    vs-ai_confirm:\n      name: confirm\n      title: 确认人机座位预约\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties: {}\n        additionalProperties: false\n        description: 无请求体\n    vs-ai_seat:\n      name: seat\n      title: 下发人机比赛座位预约\n      payload:\n        $schema: https://json-schema.org/draft/2020-12/schema\n        type: object\n        properties:\n          name:\n            type: string\n            description: 目标房间名称，例如 match\n          sessionId:\n            type: string\n            description: 客户端会话 ID\n          roomId:\n            type: string\n            description: 目标房间 ID\n          reconnectionToken:\n            description: 用于重连的令牌\n            type: string\n        required:\n          - name\n          - sessionId\n          - roomId\n        additionalProperties: false\n"
          }
        ],
        "documentDownloadType": "yaml",
        "agent": {
          "disabled": true
        },
        "theme": "default"
      })
    </script>
