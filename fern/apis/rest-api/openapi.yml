openapi: 3.0.0
info:
  title: Generals Plus REST API 文档
  version: 1.0.0
  description: Generals Plus 游戏服务端的 REST API 文档。
servers:
  - url: http://localhost:2567
    description: 本地开发服务器
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 通过 /auth/login、/auth/register 或 /auth/anonymous 获取的 JWT 令牌
  schemas:
    MapResponse:
      type: object
      properties:
        id:
          type: string
          description: 地图唯一标识
        name:
          type: string
          description: 地图名称
        description:
          type: string
          description: 地图说明
        authorId:
          type: string
          description: 作者用户 ID
        authorName:
          type: string
          description: 作者显示名称
        grid:
          oneOf:
            - type: object
              properties:
                gridType:
                  type: string
                  enum:
                    - square
                  description: 方格地图类型
                bounds:
                  type: object
                  properties:
                    width:
                      type: integer
                      minimum: 5
                      maximum: 100
                      description: 网格宽度，范围 5 到 100
                    height:
                      type: integer
                      minimum: 5
                      maximum: 100
                      description: 网格高度，范围 5 到 100
                  required:
                    - width
                    - height
                  description: 方格地图尺寸
                cells:
                  type: array
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        terrain:
                          type: string
                          enum:
                            - plain
                            - general
                            - mountain
                            - swamp
                            - desert
                            - city
                            - void
                            - flag
                            - bomb_site
                            - goal_zone
                            - rugby_spawn
                          description: 格子的地形类型
                        troopCount:
                          type: number
                          nullable: true
                          default: null
                          description: 初始兵力；非城市格子时为 null
                        siteIndex:
                          type: integer
                          nullable: true
                          minimum: 0
                          default: null
                          description: 炸弹点或旗帜的点位索引
                        zoneIndex:
                          type: integer
                          nullable: true
                          minimum: 0
                          default: null
                          description: 目标区域索引
                      required:
                        - terrain
                  description: 二维格子模板数组
                track:
                  type: array
                  items:
                    type: object
                    properties:
                      x:
                        type: integer
                        description: X 坐标
                      'y':
                        type: integer
                        description: Y 坐标
                    required:
                      - x
                      - 'y'
                  description: 运载模式轨道路径点
                spawns:
                  type: array
                  items:
                    type: object
                    properties:
                      x:
                        type: integer
                        description: 网格上的 X 坐标
                      'y':
                        type: integer
                        description: 网格上的 Y 坐标
                      teamId:
                        type: string
                        minLength: 1
                        description: 该出生点所属队伍标识
                      slot:
                        type: integer
                        minimum: 0
                        description: 该队伍内的玩家槽位索引
                    required:
                      - x
                      - 'y'
                      - teamId
                      - slot
                  description: 出生点定义
              required:
                - gridType
                - bounds
                - cells
                - spawns
            - type: object
              properties:
                gridType:
                  type: string
                  enum:
                    - hex
                  description: 六边形地图类型
                bounds:
                  type: object
                  properties:
                    left:
                      type: integer
                      minimum: 1
                      description: 左半径
                    right:
                      type: integer
                      minimum: 1
                      description: 右半径
                    leftSlant:
                      type: integer
                      minimum: 3
                      description: 左斜半径
                    rightSlant:
                      type: integer
                      minimum: 3
                      description: 右斜半径
                  required:
                    - left
                    - right
                    - leftSlant
                    - rightSlant
                  description: 六边形地图尺寸
                cells:
                  type: array
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        terrain:
                          type: string
                          enum:
                            - plain
                            - general
                            - mountain
                            - swamp
                            - desert
                            - city
                            - void
                            - flag
                            - bomb_site
                            - goal_zone
                            - rugby_spawn
                          description: 格子的地形类型
                        troopCount:
                          type: number
                          nullable: true
                          default: null
                          description: 初始兵力；非城市格子时为 null
                        siteIndex:
                          type: integer
                          nullable: true
                          minimum: 0
                          default: null
                          description: 炸弹点或旗帜的点位索引
                        zoneIndex:
                          type: integer
                          nullable: true
                          minimum: 0
                          default: null
                          description: 目标区域索引
                      required:
                        - terrain
                  description: 二维格子模板数组
                track:
                  type: array
                  items:
                    type: object
                    properties:
                      x:
                        type: integer
                        description: X 坐标
                      'y':
                        type: integer
                        description: Y 坐标
                    required:
                      - x
                      - 'y'
                  description: 运载模式轨道路径点
                spawns:
                  type: array
                  items:
                    type: object
                    properties:
                      x:
                        type: integer
                        description: 网格上的 X 坐标
                      'y':
                        type: integer
                        description: 网格上的 Y 坐标
                      teamId:
                        type: string
                        minLength: 1
                        description: 该出生点所属队伍标识
                      slot:
                        type: integer
                        minimum: 0
                        description: 该队伍内的玩家槽位索引
                    required:
                      - x
                      - 'y'
                      - teamId
                      - slot
                  description: 出生点定义
              required:
                - gridType
                - bounds
                - cells
                - spawns
          description: 地图网格布局定义
        supportedModes:
          type: array
          items:
            type: string
            enum:
              - classic
              - demolition
              - turf_war
              - biohazard
              - payload
              - rugby
              - collapse
              - domination
              - espionage
          description: 支持的游戏模式
        minPlayers:
          type: number
          description: 最小玩家人数
        maxPlayers:
          type: number
          description: 最大玩家人数
        tags:
          type: array
          items:
            type: string
          description: 可检索标签
        status:
          type: string
          enum:
            - draft
            - published
          description: 发布状态
        stats:
          type: object
          properties:
            plays:
              type: number
              description: 总游玩次数
            likes:
              type: number
              description: 总点赞数
          required:
            - plays
            - likes
          description: 地图统计信息
        thumbnail:
          type: string
          description: 缩略图 URL
        createdAt:
          anyOf:
            - type: string
            - type: string
              format: date-time
          description: 创建时间戳
        updatedAt:
          anyOf:
            - type: string
            - type: string
              format: date-time
          description: 最后更新时间戳
      required:
        - id
        - name
        - description
        - authorId
        - authorName
        - grid
        - supportedModes
        - minPlayers
        - maxPlayers
        - tags
        - status
        - stats
        - thumbnail
        - createdAt
        - updatedAt
    PublicSystemSettings:
      type: object
      properties:
        allowMapCreation:
          type: boolean
          description: 是否允许非管理员创建地图
        allowMapUpdates:
          type: boolean
          description: 是否允许非管理员更新地图
        systemBanner:
          type: string
          description: 系统横幅消息
        maxMapsPerUser:
          type: integer
          description: 每位用户可拥有的最大地图数
        maintenanceMode:
          type: boolean
          description: 维护模式状态
      required:
        - allowMapCreation
        - allowMapUpdates
        - systemBanner
        - maxMapsPerUser
        - maintenanceMode
    SystemSettings:
      type: object
      properties:
        allowMapCreation:
          type: boolean
          description: 是否允许非管理员创建地图
        allowMapUpdates:
          type: boolean
          description: 是否允许非管理员更新地图
        systemBanner:
          type: string
          description: 面向所有用户展示的系统横幅消息
        maxMapsPerUser:
          type: integer
          description: 每位用户可拥有的最大地图数
        maxTotalRooms:
          type: integer
          description: 最大同时存在的游戏房间总数，仅管理员可见
        maxVsAiRooms:
          type: integer
          description: 最大同时存在的人机对战房间数，仅管理员可见
        maintenanceMode:
          type: boolean
          description: 系统是否处于维护模式
      required:
        - allowMapCreation
        - allowMapUpdates
        - systemBanner
        - maxMapsPerUser
        - maxTotalRooms
        - maxVsAiRooms
        - maintenanceMode
    PublicUser:
      type: object
      properties:
        id:
          type: string
          description: 用户唯一标识
        email:
          type: string
          description: 用户邮箱地址
        displayName:
          type: string
          description: 显示名称
        anonymous:
          type: boolean
          description: 账号是否为匿名账号
        verified:
          type: boolean
          description: 邮箱是否已验证
        ratings:
          type: object
          additionalProperties:
            type: number
          description: 按游戏模式区分的 ELO 评分
        preferences:
          type: object
          properties:
            backgroundImage:
              oneOf:
                - type: object
                  properties:
                    source:
                      type: string
                      enum:
                        - preset
                      description: 使用内置背景预设
                    presetId:
                      type: string
                      enum:
                        - default
                        - touhou
                      description: 预设标识
                  required:
                    - source
                    - presetId
                - type: object
                  properties:
                    source:
                      type: string
                      enum:
                        - customUrl
                      description: 使用自定义背景图片 URL
                    customUrl:
                      type: string
                      description: 背景图片的 HTTP 或 HTTPS URL
                  required:
                    - source
                    - customUrl
              description: 背景图片偏好
            avatar:
              oneOf:
                - type: object
                  properties:
                    source:
                      type: string
                      enum:
                        - default
                      description: 使用默认首字母头像
                  required:
                    - source
                - type: object
                  properties:
                    source:
                      type: string
                      enum:
                        - customUrl
                      description: 使用自定义头像图片 URL
                    customUrl:
                      type: string
                      description: 头像图片的 HTTP 或 HTTPS URL
                  required:
                    - source
                    - customUrl
              description: 头像偏好
            motion:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - system
                    - full
                    - reduced
                  description: 动效偏好：system 跟随系统，full 全开，reduced 最小化
              required:
                - mode
              description: 动效偏好
            stageAppearance:
              type: object
              properties:
                backdropBlur:
                  type: boolean
                  default: true
                  description: 是否启用背景模糊效果
                backdropOpacity:
                  type: number
                  minimum: 0
                  maximum: 100
                  default: 58
                  description: 背景遮罩透明度，范围 0 到 100
              description: 舞台背景视觉控制
          required:
            - backgroundImage
            - avatar
            - motion
            - stageAppearance
          description: 用户偏好设置
        isAdmin:
          type: boolean
          description: 用户是否为管理员
      required:
        - id
    AuthUserDataResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              description: 用户唯一标识
            email:
              type: string
              description: 用户邮箱地址
            displayName:
              type: string
              description: 显示名称
            anonymous:
              type: boolean
              description: 账号是否为匿名账号
            verified:
              type: boolean
              description: 邮箱是否已验证
            ratings:
              type: object
              additionalProperties:
                type: number
              description: 按游戏模式区分的评分
            preferences:
              type: object
              additionalProperties:
                nullable: true
              description: 用户偏好设置对象
            isAdmin:
              type: boolean
              description: 用户是否为管理员
          required:
            - id
          description: 认证用户数据
      required:
        - user
    AuthSuccessResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT 认证令牌
        user:
          type: object
          properties:
            id:
              type: string
              description: 用户唯一标识
            email:
              type: string
              description: 用户邮箱地址
            displayName:
              type: string
              description: 显示名称
            anonymous:
              type: boolean
              description: 账号是否为匿名账号
            verified:
              type: boolean
              description: 邮箱是否已验证
            ratings:
              type: object
              additionalProperties:
                type: number
              description: 按游戏模式区分的评分
            preferences:
              type: object
              additionalProperties:
                nullable: true
              description: 用户偏好设置对象
            isAdmin:
              type: boolean
              description: 用户是否为管理员
          required:
            - id
          description: 认证用户数据
      required:
        - token
        - user
    CustomRoomResolution:
      type: object
      properties:
        customRoomKey:
          type: string
          description: 自定义房间密钥
        setupRoomId:
          type: string
          description: setup 房间 ID
        created:
          type: boolean
          description: 是否新建了房间，而不是加入已有房间
      required:
        - customRoomKey
        - setupRoomId
        - created
  parameters: {}
paths:
  /maps:
    get:
      summary: 获取地图列表
      description: 分页获取已发布的自定义地图，支持按模式筛选和排序。
      tags:
        - maps
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: 页码，从 1 开始
          required: false
          description: 页码，从 1 开始
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            description: 每页条目数，最大 50
          required: false
          description: 每页条目数，最大 50
          name: limit
          in: query
        - schema:
            type: string
            enum:
              - classic
              - demolition
              - turf_war
              - biohazard
              - payload
              - rugby
              - collapse
              - domination
              - espionage
            description: 按游戏模式筛选
          required: false
          description: 按游戏模式筛选
          name: mode
          in: query
        - schema:
            type: string
            enum:
              - plays
              - likes
              - date
            description: 排序方式
          required: false
          description: 排序方式
          name: sort
          in: query
        - schema:
            type: string
            description: 地图名称或作者的搜索关键词
          required: false
          description: 地图名称或作者的搜索关键词
          name: search
          in: query
      responses:
        '200':
          description: 分页地图列表
          content:
