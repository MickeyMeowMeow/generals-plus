    get:
      summary: 实时推送系统设置
      description: 通过 SSE 实时推送系统设置变更。
      tags:
        - systemSettings
      responses:
        '200':
          description: 系统设置更新的 SSE 数据流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SystemSettings'
  /profile:
    patch:
      summary: 更新用户资料
      description: 更新当前用户的显示名称和偏好设置。提交偏好设置时需要传完整对象。
      tags:
        - profile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: 显示名称，去除首尾空格后长度为 1 到 32
                preferences:
                  type: object
                  properties:
                    backgroundImage:
                      oneOf:
                        - type: object
                          properties:
                            source:
                              type: string
                              enum:
                                - preset
                              description: 使用内置背景预设
                            presetId:
                              type: string
                              enum:
                                - default
                                - touhou
                              description: 预设标识
                          required:
                            - source
                            - presetId
                        - type: object
                          properties:
                            source:
                              type: string
                              enum:
                                - customUrl
                              description: 使用自定义背景图片 URL
                            customUrl:
                              type: string
                              description: 背景图片的 HTTP 或 HTTPS URL
                          required:
                            - source
                            - customUrl
                      description: 背景图片偏好
                    avatar:
                      oneOf:
                        - type: object
                          properties:
                            source:
                              type: string
                              enum:
                                - default
                              description: 使用默认首字母头像
                          required:
                            - source
                        - type: object
                          properties:
                            source:
                              type: string
                              enum:
                                - customUrl
                              description: 使用自定义头像图片 URL
                            customUrl:
                              type: string
                              description: 头像图片的 HTTP 或 HTTPS URL
                          required:
                            - source
                            - customUrl
                      description: 头像偏好
                    motion:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - system
                            - full
                            - reduced
                          description: 动效偏好：system 跟随系统，full 全开，reduced 最小化
                      required:
                        - mode
                      description: 动效偏好
                    stageAppearance:
                      type: object
                      properties:
                        backdropBlur:
                          type: boolean
                          default: true
                          description: 是否启用背景模糊效果
                        backdropOpacity:
                          type: number
                          minimum: 0
                          maximum: 100
                          default: 58
                          description: 背景遮罩透明度，范围 0 到 100
                      description: 舞台背景视觉控制
                  required:
                    - backgroundImage
                    - avatar
                    - motion
                    - stageAppearance
                  description: 完整的用户偏好设置对象
      responses:
        '200':
          description: 用户资料更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 描述校验失败原因的错误消息
                  details:
                    nullable: true
                    description: 附加错误详情，例如 Zod issue 列表
                required:
                  - error
        '401':
          description: 需要认证
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
        '404':
          description: 未找到用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未找到地图等类似错误消息
                required:
                  - error
  /auth/userdata:
    get:
      summary: 获取当前用户资料
      description: 解析当前 Bearer 令牌并返回认证用户信息。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 认证用户数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserDataResponse'
        '401':
          description: 令牌无效或缺失
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
  /auth/register:
    post:
      summary: 注册账号
      description: 使用邮箱和密码创建新账号，返回用户信息和 JWT。
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱地址
                password:
                  type: string
                  minLength: 1
                  description: 用户密码
                options:
                  type: object
                  additionalProperties:
                    nullable: true
                  description: 附加注册选项，服务端会做清洗
              required:
                - email
                - password
      responses:
        '200':
          description: 注册成功，返回用户信息和 JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: 邮箱或密码格式不正确
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 描述校验失败原因的错误消息
                  details:
                    nullable: true
                    description: 附加错误详情，例如 Zod issue 列表
                required:
                  - error
        '401':
          description: 注册失败，例如邮箱已存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
  /auth/login:
    post:
      summary: 登录
      description: 使用邮箱和密码登录，返回用户信息和 JWT。
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱地址
                password:
                  type: string
                  minLength: 1
                  description: 用户密码
              required:
                - email
                - password
      responses:
        '200':
          description: 登录成功，返回用户信息和 JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: 凭证无效
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
  /auth/anonymous:
    post:
      summary: 匿名登录
      description: 创建匿名账号并返回用户信息和 JWT。
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  type: object
                  additionalProperties:
                    nullable: true
                  description: 可选的匿名用户初始化数据
      responses:
        '200':
          description: 匿名登录成功，返回用户信息和 JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: 匿名登录失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
  /auth/forgot-password:
    post:
      summary: 请求密码重置
      description: 触发找回密码流程。当前运行时是否可用取决于鉴权回调配置。
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱地址
              required:
                - email
      responses:
        '200':
          description: 找回密码处理器已接受请求
          content:
            application/json:
              schema:
                anyOf:
                  - type: boolean
                  - type: object
                    additionalProperties:
                      nullable: true
        '401':
          description: 找回密码流程不可用，或请求被拒绝
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
  /colyseus/login:
    post:
      summary: 登录 Colyseus 管理面板
      description: 使用 JWT 换取 Colyseus Monitor 的 httpOnly Cookie，并重定向到管理页面。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT 认证令牌
                basePath:
                  type: string
                  description: Cookie 生效的基础路径
              required:
                - token
      responses:
        '302':
          description: 设置认证 Cookie 后重定向到 /colyseus/
        '401':
          description: 令牌无效
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
        '403':
          description: 不是管理员
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 操作被禁止的原因
                required:
                  - error
  /custom-rooms:
    post:
      summary: 创建自定义房间
      description: 创建自定义房间。可指定房间密钥，不指定则自动生成。
      tags:
        - customRooms
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customRoomKey:
                  type: string
                  minLength: 4
                  maxLength: 16
                  description: 自定义房间密钥，长度 4 到 16；省略时自动生成
      responses:
        '201':
          description: 自定义房间创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoomResolution'
        '400':
          description: 自定义房间密钥无效
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 描述校验失败原因的错误消息
                  details:
                    nullable: true
                    description: 附加错误详情，例如 Zod issue 列表
                required:
                  - error
        '401':
          description: 需要认证
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
        '409':
          description: 房间已存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 冲突原因
                required:
                  - error
  /custom-rooms/{customRoomKey}/resolve:
    post:
      summary: 解析自定义房间
      description: 根据密钥加入已有房间，或在不存在时创建一个新的 setup 房间。
      tags:
        - customRooms
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            description: 待解析的自定义房间密钥，长度 4 到 16
          required: true
          description: 待解析的自定义房间密钥，长度 4 到 16
          name: customRoomKey
          in: path
      responses:
        '200':
          description: 房间解析成功，已加入或已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoomResolution'
        '400':
          description: 自定义房间密钥无效
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 描述校验失败原因的错误消息
                  details:
                    nullable: true
                    description: 附加错误详情，例如 Zod issue 列表
                required:
                  - error
        '401':
          description: 需要认证
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 未授权
                required:
                  - error
        '409':
          description: 房间已满
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 冲突原因
                required:
                  - error
  /health:
    get:
      summary: 服务器健康检查
      description: 返回服务器健康状态和运行时间。
      tags:
        - health
      responses:
        '200':
          description: 服务器状态正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                    description: 健康状态，健康时固定为 "ok"
                  uptime:
                    type: number
                    description: 服务器已运行秒数
                required:
                  - status
                  - uptime
  /ai/health:
    get:
      summary: AI 服务健康检查
      description: 检查 Python AI 机器人服务的健康状态。不可用时返回 503。
      tags:
        - health
      responses:
        '200':
          description: AI 机器人服务可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    enum:
                      - true
                    description: AI 机器人服务可用
                required:
                  - available
        '503':
          description: AI 机器人服务不可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    enum:
                      - false
                    description: AI 机器人服务不可用
                  error:
                    type: string
                    description: 错误说明
                required:
                  - available
                  - error
tags:
  - name: maps
    x-displayName: 地图
  - name: systemSettings
    x-displayName: 系统设置
  - name: profile
    x-displayName: 用户资料
  - name: auth
    x-displayName: 认证
  - name: customRooms
    x-displayName: 自定义房间
  - name: health
    x-displayName: 健康检查
